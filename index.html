<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lavender Recipe Hub 🌸</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Lavender Recipe Hub 🌸</h1>
    <p>Share your passion for cooking with the world!</p>
  </header>

  <div class="container">
    <div class="top-bar">
      <input type="text" id="searchBar" placeholder="🔍 Search recipes..." onkeyup="searchRecipes()">
      <button class="upload-btn" onclick="window.location.href='add.html'">➕ Upload Recipe</button>
    </div>

    <div id="recipeCount"></div>
    <div id="recipeList" class="grid"></div>
  </div>

  <footer>
    <p>Made with 💜 by Shubhangi</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
